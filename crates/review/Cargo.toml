[package]
name = "craig-review"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
keywords = ["privacy", "local-inference", "offline", "open-source-models", "span-replacement"]
categories = ["development-tools::testing", "text-processing"]

[features]
judge = ["dep:reqwest", "dep:ctrlc"]

[[bin]]
name = "craig-review"
path = "src/main.rs"
required-features = ["judge"]

[dependencies]
craig.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
rusqlite = { version = "0.38", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
rand = "0.9"
hmac = "0.12"
fs2 = "0.4"
reqwest = { version = "0.12", optional = true, default-features = false, features = ["blocking", "json", "rustls-tls"] }
ctrlc = { version = "3", optional = true }

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO"] }
