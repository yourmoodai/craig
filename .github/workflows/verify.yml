name: verify
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: verify-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  tooling:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node scripts/verify-branding.mjs
      - run: python3 -m unittest discover -s tools/adversarial_reviewer
      - run: python3 -m unittest discover -s scripts/release
  coreml:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: restore rust dependencies
        id: rust_cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: coreml-macos-15-${{ runner.arch }}
          cache-on-failure: true
      - name: native build
        run: cargo clippy -p savior --features coreml --all-targets -- -D warnings
      - run: cargo test -p savior --features coreml
      - name: summarize cache measurements
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          CACHE_HIT: ${{ steps.rust_cache.outputs.cache-hit }}
          CACHE_GROUP: coreml-macos-15-${{ runner.arch }}
          CACHE_JOB: coreml
        with:
          script: |
            await require('./scripts/release/cache-summary.cjs')({github, context, core});
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: .cache/host-types
          key: host-types-v1-${{ runner.os }}-${{ hashFiles('scripts/fetch-types.mjs') }}
      - name: restore rust dependencies
        id: rust_cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-${{ matrix.os }}-${{ runner.arch }}
          cache-on-failure: true
      - name: native build
        run: npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: npm run check
      - run: npm test
      - uses: ./.github/actions/model-cache
      - run: npm run eval:local
      - run: npm run inspect:test
      - run: npx playwright install --with-deps --only-shell chromium
      - name: standalone local inspector browser checks
        env:
          SAVIOR_MODEL_DIR: ${{ github.workspace }}/.cache/models/mudes-en-base
        run: npm run inspect:e2e
      - name: native assessment and synthetic SDK history
        env:
          SAVIOR_MODEL_DIR: ${{ github.workspace }}/.cache/models/mudes-en-base
        run: node --test tests/review.spec.mjs
      - name: real model training and reload parity
        if: github.event_name == 'workflow_dispatch'
        env:
          SAVIOR_MODEL_DIR: ${{ github.workspace }}/.cache/models/mudes-en-base
        run: cargo test --profile profiling -p savior-lab --test cli -- --ignored
      - name: summarize cache measurements
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          CACHE_HIT: ${{ steps.rust_cache.outputs.cache-hit }}
          CACHE_GROUP: native-${{ matrix.os }}-${{ runner.arch }}
          CACHE_JOB: native (${{ matrix.os }})
        with:
          script: |
            await require('./scripts/release/cache-summary.cjs')({github, context, core});
