name: verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  coreml:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: restore rust dependencies
        id: rust_cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: coreml-macos-15-${{ runner.arch }}
          cache-on-failure: true
      - name: native build
        run: cargo clippy -p craig --features coreml --all-targets -- -D warnings
      - run: cargo test -p craig --features coreml
      - name: summarize cache measurements
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          CACHE_HIT: ${{ steps.rust_cache.outputs.cache-hit }}
          CACHE_GROUP: coreml-macos-15-${{ runner.arch }}
          CACHE_JOB: coreml
        with:
          script: |
            await require('./scripts/release/cache-summary.cjs')({github, context, core});
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: restore rust dependencies
        id: rust_cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-${{ matrix.os }}-${{ runner.arch }}
          cache-on-failure: true
      - name: native build
        run: npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: npm run check
      - run: npm test
      - run: python3 -m unittest discover -s tools/adversarial_reviewer
      - run: python3 -m unittest discover -s scripts/release
      - run: npm run model:fetch
      - run: npm run eval:local
      - run: npm run inspect:test
      - run: npx playwright install --with-deps chromium
      - name: standalone local inspector browser checks
        env:
          CRAIG_MODEL_DIR: ${{ github.workspace }}/.cache/models/mudes-en-base
        run: npm run inspect:e2e
      - name: native assessment and synthetic SDK history
        env:
          CRAIG_MODEL_DIR: ${{ github.workspace }}/.cache/models/mudes-en-base
        run: node --test tests/review.spec.mjs
      - name: real model training and reload parity
        if: github.event_name == 'workflow_dispatch'
        env:
          CRAIG_MODEL_DIR: ${{ github.workspace }}/.cache/models/mudes-en-base
        run: cargo test --profile profiling -p craig-lab --test cli -- --ignored
      - name: summarize cache measurements
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          CACHE_HIT: ${{ steps.rust_cache.outputs.cache-hit }}
          CACHE_GROUP: native-${{ matrix.os }}-${{ runner.arch }}
          CACHE_JOB: native (${{ matrix.os }})
        with:
          script: |
            await require('./scripts/release/cache-summary.cjs')({github, context, core});
