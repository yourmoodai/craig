name: adversarial code review
on:
  push:
    branches: [develop]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string
permissions:
  contents: read
jobs:
  scope:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head: ${{ steps.scope.outputs.head }}
      pr: ${{ steps.scope.outputs.pr }}
      base: ${{ steps.scope.outputs.base }}
    steps:
      - uses: actions/github-script@v7
        id: scope
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        with:
          script: |
            if (context.eventName === 'push') {
              const pulls = (await github.rest.pulls.list({...context.repo, state:'open',head:context.repo.owner+':develop',base:'main'})).data;
              if (pulls.length !== 1) throw Error('expected one open develop PR');
              process.env.PR_NUMBER=String(pulls[0].number);
            }
            if (!/^[1-9][0-9]*$/.test(process.env.PR_NUMBER)) throw Error('invalid PR');
            const pr = (await github.rest.pulls.get({...context.repo, pull_number:Number(process.env.PR_NUMBER)})).data;
            if (pr.state !== 'open' || pr.draft) throw Error('PR is not ready');
            core.setOutput('pr', pr.number);
            core.setOutput('head', pr.head.sha);
            core.setOutput('base', pr.base.sha);
  review:
    name: adversarial verdict
    needs: scope
    runs-on: ubuntu-24.04
    concurrency:
      group: review-pr-${{ needs.scope.outputs.pr }}
      cancel-in-progress: false
    timeout-minutes: 120
    environment:
      name: default
      deployment: false
    permissions:
      contents: read
      pull-requests: write
      actions: read
    env:
      HEAD_SHA: ${{ needs.scope.outputs.head }}
      PR_NUMBER: ${{ needs.scope.outputs.pr }}
    steps:
      # Only trusted base code executes with secrets. PR code is diff data.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: update review status
        uses: actions/github-script@v7
        with:
          script: |
            const publish = require('./tools/adversarial_reviewer/publish.cjs');
            await publish({github, context, core, head:process.env.HEAD_SHA, pr:process.env.PR_NUMBER, phase:'waiting'});
      - name: wait for required tests on this commit
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ needs.scope.outputs.head }}
          PR_NUMBER: ${{ needs.scope.outputs.pr }}
        with:
          script: |
            const gate = require('./tools/adversarial_reviewer/test_gate.cjs');
            await gate({github, context, head:process.env.HEAD_SHA, pr:process.env.PR_NUMBER, output:process.env.RUNNER_TEMP+'/review-tests.json'});
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
      - name: fetch diff without checkout
        env:
          PR_NUMBER: ${{ needs.scope.outputs.pr }}
        run: git fetch origin "pull/$PR_NUMBER/head"
      - name: qualify and assess
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          BASE_SHA: ${{ needs.scope.outputs.base }}
          HEAD_SHA: ${{ needs.scope.outputs.head }}
          REVIEW_TEST_EVIDENCE: ${{ runner.temp }}/review-tests.json
        run: python3 tools/adversarial_reviewer/run_ci.py
      - uses: actions/upload-artifact@v4
        with:
          name: adversarial-report
          path: review-result/report.json
          if-no-files-found: error
      - name: publish verdict
        uses: actions/github-script@v7
        with:
          script: |
            const report = JSON.parse(require('node:fs').readFileSync('review-result/report.json', 'utf8'));
            const publish = require('./tools/adversarial_reviewer/publish.cjs');
            await publish({github, context, core, head:process.env.HEAD_SHA, pr:process.env.PR_NUMBER, phase:'complete', report});
            core.setOutput('published', 'true');
        id: verdict
      - name: publish unavailable status
        if: failure() && steps.verdict.outputs.published != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const publish = require('./tools/adversarial_reviewer/publish.cjs');
            const fs = require('node:fs');
            const path = process.env.RUNNER_TEMP+'/review-tests.json';
            const evidence = fs.existsSync(path) ? JSON.parse(fs.readFileSync(path, 'utf8')) : undefined;
            await publish({github, context, core, head:process.env.HEAD_SHA, pr:process.env.PR_NUMBER, phase:'failed', evidence});
