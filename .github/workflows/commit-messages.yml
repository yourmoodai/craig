name: commit messages
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked -p commit_check
      - name: check new commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          POLICY_BASE: cde250554fee48e5d231054c666426b7aa24d291
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ]; then
            BASE_SHA="$POLICY_BASE"
          fi
          # Published bootstrap history predates this check.
          if git merge-base --is-ancestor "$BASE_SHA" "$POLICY_BASE" && git merge-base --is-ancestor "$POLICY_BASE" "$HEAD_SHA"; then
            BASE_SHA="$POLICY_BASE"
          fi
          cargo run --locked --quiet -p commit_check -- --range "$BASE_SHA" "$HEAD_SHA"
      - name: check pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | cargo run --locked --quiet -p commit_check
